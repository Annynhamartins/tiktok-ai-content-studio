<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok AI Content Studio</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 700px;
            width: 100%;
            margin-top: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 2rem;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-muted);
        }

        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 15px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            color: white;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            opacity: 0.9;
        }

        .result-box {
            display: none;
        }

        .section-title {
            font-weight: bold;
            color: #38bdf8;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        .section-content {
            background-color: #0f172a;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #e2e8f0;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🚀 TikTok AI Studio</h1>
        <p style="color: var(--text-muted)">Gerador automático de roteiros e respostas virais</p>
    </div>

    <div class="card">
        <label for="tema">Tema do Vídeo ou Comentário do Seguidor:</label>
        <textarea id="tema" rows="3" placeholder="Ex: Dicas de vendas, Ou cole uma pergunta do TikTok aqui..."></textarea>

        <button id="btnGerar" onclick="gerarRoteiro()">✨ Gerar Conteúdo Completo</button>
    </div>

    <div id="resultado" class="card result-box">
        <div class="section-title">🪝 Gancho Inicial (Primeiros 3s)</div>
        <div id="res-gancho" class="section-content"></div>

        <div class="section-title">📝 Conteúdo do Vídeo</div>
        <div id="res-conteudo" class="section-content"></div>

        <div class="section-title">📢 Chamada para Ação (CTA)</div>
        <div id="res-cta" class="section-content"></div>
    </div>
</div>

<script>
    async function gerarRoteiro() {
        const inputTema = document.getElementById('tema');
        const btn = document.getElementById('btnGerar');
        const boxResultado = document.getElementById('resultado');

        const tema = inputTema ? inputTema.value.trim() : '';

        if (!tema) {
            alert("Por favor, digite um tema ou comentário!");
            return;
        }

        btn.disabled = true;
        btn.innerText = "⏳ Gerando com IA...";
        if (boxResultado) boxResultado.style.display = "none";

        try {
            const response = await fetch('https://tiktok-ai-content-studio.onrender.com/api/gerar-roteiro', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ tema: tema })
            });

            const data = await response.json();

            if (response.ok) {
                document.getElementById('res-gancho').innerText = data.gancho || '';
                document.getElementById('res-conteudo').innerText = data.conteudo || '';
                document.getElementById('res-cta').innerText = data.cta || '';
                boxResultado.style.display = "block";
            } else {
                alert("Erro no servidor: " + (data.error || "Erro ao gerar roteiro."));
            }
        } catch (error) {
            console.error(error);
            alert("O servidor está conectando (pode levar alguns segundos na primeira vez). Tente clicar novamente!");
        } finally {
            btn.disabled = false;
            btn.innerText = "✨ Gerar Conteúdo Completo";
        }
    }
</script>

</body>
</html>
