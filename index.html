<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok-AI Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🚀 TikTok-AI Studio</h1>
        <p>Gerador automatizado de roteiros, legendas, hashtags e prompts para redes sociais.</p>

        <div class="form-group">
            <label for="plataforma">Plataforma Alvo:</label>
            <select id="plataforma">
                <option value="tiktok">TikTok</option>
                <option value="instagram">Instagram Reels</option>
                <option value="youtube">YouTube Shorts</option>
            </select>
        </div>

        <div class="form-group">
            <label for="tema">Tema ou Produto:</label>
            <input type="text" id="tema" placeholder="Ex: Creatina, Treino em Casa, Dicas de Vendas">
        </div>

        <button id="btnGerar">✨ Gerar Conteúdo Completo</button>

        <div id="resultado" class="hidden">
            <h2>📋 Seu Conteúdo Gerado:</h2>

            <h3>🎬 Roteiro do Vídeo</h3>
            <pre id="outRoteiro"></pre>

            <h3>✍️ Legenda Sugerida</h3>
            <pre id="outLegenda"></pre>

            <h3>🏷️ Hashtags Virais</h3>
            <pre id="outHashtags"></pre>

            <h3>🖼️ Prompt de Imagem/Vídeo (IA)</h3>
            <pre id="outPrompt"></pre>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
